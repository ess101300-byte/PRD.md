<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="제로 모공 토너 패드">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef4ff"/><stop offset="1" stop-color="#cfe0ff"/></linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.26" r="0.7"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7fa6ff"/><stop offset="0.2" stop-color="#cfe0ff"/><stop offset="0.5" stop-color="#5b8bff"/><stop offset="0.85" stop-color="#2f6bff"/><stop offset="1" stop-color="#1c4fd6"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#c9d6f5"/></linearGradient>
    <ellipse id="e" /><filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/><rect width="600" height="600" fill="url(#glow)"/>
  <ellipse cx="300" cy="500" rx="168" ry="30" fill="#1c4fd6" opacity="0.28" filter="url(#soft)"/>

  <!-- jar body -->
  <path d="M160 250 q0 -14 14 -14 h252 q14 0 14 14 v150 q0 60 -140 60 t-140 -60 z" fill="url(#jar)"/>
  <ellipse cx="300" cy="250" rx="140" ry="34" fill="#1c4fd6"/>
  <!-- lid -->
  <ellipse cx="300" cy="236" rx="150" ry="40" fill="url(#lid)"/>
  <ellipse cx="300" cy="230" rx="150" ry="38" fill="#eaf0ff"/>
  <ellipse cx="300" cy="228" rx="120" ry="28" fill="#dbe7ff"/>
  <!-- highlight -->
  <path d="M182 268 q6 120 40 150" stroke="#ffffff" stroke-width="14" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- label -->
  <rect x="212" y="322" width="176" height="96" rx="12" fill="#ffffff" opacity="0.95"/>
  <text x="300" y="352" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#2f6bff">GLOWLAB</text>
  <text x="300" y="384" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="26" font-weight="900" fill="#16181d">ZERO PORE</text>
  <text x="300" y="406" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#6b7280">토너 패드 · 70매</text>

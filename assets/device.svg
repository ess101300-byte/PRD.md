<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="부스터 프로 홈 뷰티 디바이스">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef3ff"/><stop offset="1" stop-color="#c9d6f5"/></linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.24" r="0.7"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9db8ff"/><stop offset="0.2" stop-color="#eef3ff"/><stop offset="0.55" stop-color="#c9d6f5"/><stop offset="0.85" stop-color="#8aa3e6"/><stop offset="1" stop-color="#6d86cf"/></linearGradient>
    <radialGradient id="head" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#d7e2ff"/><stop offset="1" stop-color="#9db8ff"/></radialGradient>
    <radialGradient id="ring" cx="0.5" cy="0.5" r="0.5"><stop offset="0.6" stop-color="#2f6bff" stop-opacity="0"/><stop offset="0.85" stop-color="#5b8bff" stop-opacity="0.55"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/><rect width="600" height="600" fill="url(#glow)"/>
  <ellipse cx="300" cy="520" rx="120" ry="24" fill="#3a56a8" opacity="0.3" filter="url(#soft)"/>

  <!-- device body -->
  <path d="M226 150 q74 -56 148 0 v250 q0 76 -74 76 t-74 -76 z" fill="url(#body)"/>
  <!-- treatment head glow -->
  <circle cx="300" cy="196" r="96" fill="url(#ring)"/>
  <circle cx="300" cy="196" r="72" fill="url(#head)"/>
  <circle cx="300" cy="196" r="72" fill="none" stroke="#5b8bff" stroke-width="4" opacity="0.5"/>
  <!-- metal nodes -->
  <circle cx="300" cy="196" r="10" fill="#2f6bff"/>
  <circle cx="268" cy="176" r="7" fill="#7fa6ff"/><circle cx="332" cy="176" r="7" fill="#7fa6ff"/>
  <circle cx="268" cy="216" r="7" fill="#7fa6ff"/><circle cx="332" cy="216" r="7" fill="#7fa6ff"/>
  <!-- highlight -->
  <path d="M242 176 q-10 150 24 250" stroke="#ffffff" stroke-width="12" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- power button -->
  <circle cx="300" cy="392" r="30" fill="#1c4fd6"/>
  <circle cx="300" cy="392" r="30" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <path d="M300 378 v16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <path d="M289 382 a15 15 0 1 0 22 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="300" y="452" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="17" font-weight="900" letter-spacing="1" fill="#1c4fd6">BOOSTER PRO</text>
</svg>

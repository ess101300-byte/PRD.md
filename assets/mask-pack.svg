<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="핑크 콜라겐 탄력 마스크팩">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1f6"/><stop offset="1" stop-color="#ffd4e4"/></linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.26" r="0.7"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3cf"/><stop offset="0.5" stop-color="#ff86ac"/><stop offset="1" stop-color="#f85f8e"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/><rect width="600" height="600" fill="url(#glow)"/>
  <ellipse cx="310" cy="500" rx="150" ry="26" fill="#c94170" opacity="0.28" filter="url(#soft)"/>

  <!-- pouch -->
  <g transform="rotate(-7 300 300)">
    <rect x="176" y="120" width="248" height="360" rx="18" fill="url(#pouch)"/>
    <!-- serrated top -->
    <path d="M176 130 l14 -10 14 10 14 -10 14 10 14 -10 14 10 14 -10 14 10 14 -10 14 10 14 -10 14 10 14 -10 14 10 14 -10 14 10 v-16 h-248 z" fill="#fff" opacity="0.65"/>
    <!-- shine -->
    <path d="M210 150 q-16 160 20 300" stroke="#ffffff" stroke-width="18" fill="none" opacity="0.35" stroke-linecap="round"/>
    <!-- label plate -->
    <rect x="212" y="238" width="176" height="150" rx="14" fill="#ffffff" opacity="0.95"/>
    <text x="300" y="272" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#2f6bff">GLOWLAB</text>
    <text x="300" y="316" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="30" font-weight="900" fill="#f85f8e">PINK</text>
    <text x="300" y="346" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="20" font-weight="900" fill="#f85f8e">COLLAGEN</text>
    <text x="300" y="372" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#6b7280">탄력 마스크팩 10매</text>
  </g>
</svg>

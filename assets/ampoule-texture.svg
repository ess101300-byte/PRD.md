<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="앰플 제형 텍스처">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1f6"/><stop offset="1" stop-color="#ffcfe0"/></linearGradient>
    <radialGradient id="drop" cx="0.38" cy="0.32" r="0.8"><stop offset="0" stop-color="#ffd7e6"/><stop offset="0.5" stop-color="#ff8fb4"/><stop offset="1" stop-color="#ff5f92"/></radialGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.75"><stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/><rect width="600" height="600" fill="url(#glow)"/>
  <!-- big droplet -->
  <ellipse cx="300" cy="360" rx="150" ry="130" fill="#e8608f" opacity="0.25" filter="url(#soft)"/>
  <path d="M300 150 C 380 260 430 300 430 370 a130 130 0 1 1 -260 0 c0 -70 50 -110 130 -220 z" fill="url(#drop)"/>
  <ellipse cx="255" cy="330" rx="46" ry="30" fill="#ffffff" opacity="0.55"/>
  <circle cx="360" cy="410" r="12" fill="#fff" opacity="0.4"/>
  <circle cx="330" cy="300" r="7" fill="#fff" opacity="0.5"/>
  <!-- small droplets -->
  <circle cx="150" cy="200" r="20" fill="url(#drop)" opacity="0.9"/>
  <circle cx="142" cy="193" r="6" fill="#fff" opacity="0.6"/>
  <circle cx="470" cy="180" r="14" fill="url(#drop)" opacity="0.9"/>
  <text x="300" y="540" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="20" font-weight="800" fill="#d6316a">촉촉한 워터 세럼 제형</text>
</svg>
